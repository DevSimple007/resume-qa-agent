<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 小尺寸专用简化版：容器与配色同完整版，内部元素放大加粗，32px 以下依然清晰 -->
  <defs>
    <radialGradient id="smallGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>
    <linearGradient id="smallBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="smallAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="smallSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- 容器（Apple squircle） -->
  <rect x="48" y="48" width="416" height="416" rx="104" fill="url(#smallGlow)" />
  <rect x="48" y="48" width="416" height="416" rx="104" fill="none" stroke="url(#smallBorder)" stroke-width="2" />

  <!-- 简历卡片（放大简化：更少、更粗的内容条） -->
  <rect x="128" y="104" width="216" height="304" rx="36" fill="#ffffff" />
  <rect x="128" y="104" width="216" height="304" rx="36" fill="none" stroke="#e2e8f0" stroke-width="3" />
  <circle cx="180" cy="164" r="22" fill="#e2e8f0" />
  <rect x="216" y="148" width="92" height="14" rx="7" fill="url(#smallAccent)" />
  <rect x="216" y="172" width="56" height="10" rx="5" fill="#94a3b8" />
  <rect x="164" y="224" width="144" height="12" rx="6" fill="#334155" />
  <rect x="164" y="252" width="144" height="12" rx="6" fill="#cbd5e1" />
  <rect x="164" y="280" width="100" height="12" rx="6" fill="#cbd5e1" />
  <rect x="164" y="316" width="120" height="12" rx="6" fill="#334155" />
  <rect x="164" y="344" width="144" height="12" rx="6" fill="#cbd5e1" />

  <!-- AI 对话节点（放大简化：三个加粗脉冲点 + 星火） -->
  <rect x="248" y="268" width="168" height="152" rx="44" fill="#ffffff" />
  <rect x="248" y="268" width="168" height="152" rx="44" fill="none" stroke="#e2e8f0" stroke-width="3" />
  <circle cx="302" cy="344" r="10" fill="#0f172a" />
  <circle cx="332" cy="344" r="13" fill="url(#smallAccent)" />
  <circle cx="362" cy="344" r="10" fill="#0f172a" />
  <path d="M 366,300 Q 366,314 380,314 Q 366,314 366,328 Q 366,314 352,314 Q 366,314 366,300 Z" fill="url(#smallSparkle)" />
</svg>
