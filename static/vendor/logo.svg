<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Soft Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>

    <!-- Subtle Container Border Gradient -->
    <linearGradient id="subtleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.5" />
    </linearGradient>

    <!-- Soft Glass Linear Gradient -->
    <linearGradient id="glassDoc" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.85" />
    </linearGradient>

    <!-- Refined Accent Gradient: Apple / BigModel inspired Slate to Soft Indigo Blue -->
    <linearGradient id="accentCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="glowSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Extremely subtle shadow -->
    <filter id="softElevation" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="24" stdDeviation="36" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>

    <filter id="gentleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Icon Body (Apple squircle aesthetic) -->
  <rect x="48" y="48" width="416" height="416" rx="104" fill="url(#ambientGlow)" />
  <rect x="48" y="48" width="416" height="416" rx="104" fill="none" stroke="url(#subtleBorder)" stroke-width="2" />

  <!-- Inner Soft Light Ring -->
  <rect x="52" y="52" width="408" height="408" rx="100" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Central Graphic Group with Soft Elevation -->
  <g filter="url(#softElevation)">
    <!-- Base Resume Document Card (Clean, architectural structure) -->
    <rect x="150" y="128" width="176" height="256" rx="28" fill="url(#glassDoc)" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Structured Document Grid Lines (Representing rigorous profile / CV content) -->
    <!-- Profile Avatar placeholder / Header block -->
    <circle cx="196" cy="180" r="16" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.2" />
    <rect x="224" y="172" width="70" height="8" rx="4" fill="#0f172a" fill-opacity="0.8" />
    <rect x="224" y="186" width="42" height="6" rx="3" fill="#94a3b8" />

    <!-- Section line -->
    <line x1="180" y1="216" x2="296" y2="216" stroke="#f1f5f9" stroke-width="1.5" stroke-linecap="round" />

    <!-- Body content rhythm lines -->
    <rect x="180" y="234" width="94" height="6" rx="3" fill="#334155" fill-opacity="0.75" />
    <rect x="180" y="248" width="116" height="5" rx="2.5" fill="#cbd5e1" />
    <rect x="180" y="260" width="102" height="5" rx="2.5" fill="#cbd5e1" />

    <rect x="180" y="284" width="80" height="6" rx="3" fill="#334155" fill-opacity="0.75" />
    <rect x="180" y="298" width="116" height="5" rx="2.5" fill="#cbd5e1" />
    <rect x="180" y="310" width="88" height="5" rx="2.5" fill="#cbd5e1" />

    <rect x="180" y="334" width="60" height="5" rx="2.5" fill="#e2e8f0" />
    <rect x="248" y="334" width="48" height="5" rx="2.5" fill="#e2e8f0" />
  </g>

  <!-- Foreground Dynamic Element: Agent Spark / Intelligence Dialog Node -->
  <!-- A minimal overlapping frosted squircle representing the Candidate's Responsive AI Avatar -->
  <g filter="url(#softElevation)">
    <!-- Floating Agent Chat & Intelligence Node -->
    <rect x="254" y="254" width="144" height="136" rx="36" fill="#ffffff" fill-opacity="0.95" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- Inner Subtle Glow border -->
    <rect x="256" y="256" width="140" height="132" rx="34" fill="none" stroke="url(#subtleBorder)" stroke-width="1" />

    <!-- Dynamic Wave / Interaction Indicator: 3 Precision Audio/Neural Dots -->
    <g transform="translate(290, 314)">
      <!-- Left Pulse dot -->
      <circle cx="12" cy="8" r="6" fill="#0f172a" fill-opacity="0.9" />
      <!-- Center Elevated Sparkle Dot (Subtle BigModel/Apple glow gradient) -->
      <circle cx="36" cy="8" r="8" fill="url(#accentCore)" />
      <!-- Right Pulse dot -->
      <circle cx="60" cy="8" r="6" fill="#0f172a" fill-opacity="0.9" />

      <!-- Minimal Intelligent Sparkle (Agent Indicator on top right of the node) -->
      <path d="M 62,-16 Q 62,-4 74,-4 Q 62,-4 62,8 Q 62,-4 50,-4 Q 62,-4 62,-16 Z" fill="url(#glowSparkle)" opacity="0.95" />
    </g>
  </g>

  <!-- Micro accent lighting reflect point -->
  <circle cx="150" cy="128" r="2" fill="#ffffff" opacity="0.8" />
</svg>
